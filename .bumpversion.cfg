[bumpversion]
current_version = 2.1.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file(mcp-img):docker/Dockerfile]
search = stirlingpdf-agent[mcp]>={current_version}
replace = stirlingpdf-agent[mcp]>={new_version}

[bumpversion:file(agent-img):docker/Dockerfile]
search = stirlingpdf-agent[agent]>={current_version}
replace = stirlingpdf-agent[agent]>={new_version}

[bumpversion:file(tag-example):docker/Dockerfile]
search = -t stirlingpdf-agent:{current_version} .
replace = -t stirlingpdf-agent:{new_version} .

[bumpversion:file(readme-img-tag):README.md]
search = knucklessg1/stirlingpdf-agent:{current_version}
replace = knucklessg1/stirlingpdf-agent:{new_version}

[bumpversion:file(readme-img-tag-short):README.md]
search = agent (`:{current_version}`)
replace = agent (`:{new_version}`)

[bumpversion:file:stirlingpdf_agent/agent_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:stirlingpdf_agent/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
